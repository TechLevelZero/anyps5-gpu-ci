name: anyps5-gpu-ci

services:
  runner-image:
    image: anyps5-gpu-ci-runner:latest
    build: ./runner
    profiles: ["build"]

  poller:
    image: anyps5-gpu-ci-poller:latest
    build: ./poller
    restart: unless-stopped
    env_file: config.env
    user: "${HOST_UID}:${HOST_GID}"
    group_add: ["${DOCKER_GID}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}:${DATA_DIR}
      - /etc/os-release:/host/os-release:ro
    networks: [ci]

  stats:
    image: anyps5-gpu-ci-poller:latest
    restart: unless-stopped
    entrypoint: ["python3", "/app/stats.py"]
    env_file: config.env
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ${DATA_DIR}:${DATA_DIR}:ro
    networks: [ci]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [ci]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports: ["${GRAFANA_PORT}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in config.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/anyps5-gpu-ci.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    networks: [ci]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [ci]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd/:/var/lib/containerd:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks: [ci]

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    restart: unless-stopped
    command:
      - --query-field-names=uuid,name,driver_version,utilization.gpu,utilization.memory,memory.used,memory.total,temperature.gpu,power.draw,clocks.sm,fan.speed,pstate
    devices: ["nvidia.com/gpu=all"]
    networks: [ci]

volumes:
  prometheus:
  grafana:

networks:
  ci:
